<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:'Poppins',sans-serif;
}
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ffb6c1,#d1c4e9,#a5d8ff); 
  overflow:hidden;
  position:relative;
  transition: background 0.4s ease, color 0.4s ease;
  color:#333;
}
.calendar-container{
  width:90%;
  max-width:400px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(12px);
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
  position:relative;
  transition: background 0.4s ease, color 0.4s ease;
  z-index: 10;
}
.year-input {
  margin-bottom: 10px;
  width: 90px;
  font-size: 1em;
  padding: 5px;
  border-radius: 8px;
  border: none;
  text-align: center;
  position: relative;
}
.year-input.blink::after {
  content: "|";
  position: absolute;
  right: 10px;
  animation: blink 1s steps(2, start) infinite;
}
@keyframes blink {
  to { visibility: hidden; }
}
.nav-arrows{
  display:flex;
  justify-content:space-between;
  font-size:1.5em;
  margin-bottom:10px;
  cursor:pointer;
  user-select:none;
  color:#333;
  transition: color 0.4s ease;
}
.month{
  font-size:1.5em;
  font-weight:600;
  margin-bottom:12px;
  color:#333;
  transition: color 0.4s ease;
}
.weekdays,.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  font-size:0.9em;
}
.weekdays div{
  font-weight:600;
  color:#555;
  transition: color 0.4s ease;
}
.days div{
  padding:10px;
  border-radius:12px;
  opacity:0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease, color 0.4s ease;
  color:#333;
}
.days div.weekend{
  color:#ff69b4;
  transition: color 0.4s ease;
}
.toggle-btn{
  position:fixed;
  top:15px;
  right:15px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  background:#fff;
  cursor:pointer;
  font-size:1.2em;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition: background 0.3s ease;
  z-index:100;
}
body.dark{
  background: linear-gradient(135deg,#2c3e50,#34495e,#1abc9c);
  color:#fff;
}
body.dark .calendar-container{
  background: rgba(0,0,0,0.3);
  color:#fff;
}
body.dark .month{
  color:#fff;
}
body.dark .nav-arrows{
  color:#fff;
}
body.dark .weekdays div{
  color:#ddd;
}
body.dark .days div{
  color:#fff;
}
body.dark .days div.weekend{
  color:#ff8080;
}
.flower {
  position: fixed;
  top: -50px;
  width: 30px;
  height: 30px;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 0;
}
.petal {
  position: absolute;
  width: 12px;
  height: 20px;
  background: #9b59b6;
  border-radius: 50% 50% 0 0;
  top: 50%;
  left: 50%;
  transform-origin: bottom center;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity:0.9; }
}
</style>
</head>
<body>

<button class="toggle-btn" id="toggle">🌙</button>

<div class="calendar-container">
  <input type="number" id="yearInput" class="year-input blink" value="2025" min="1000" max="9999">
  <div class="nav-arrows">
    <span id="prev">◀</span>
<span id="next">▶</span>
  </div>
  <div id="calendar"></div>
</div>

<script>
const calendar = document.getElementById("calendar");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const toggleBtn = document.getElementById("toggle");
const yearInput = document.getElementById("yearInput");
const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
let currentMonth = 0;
let currentYear = parseInt(yearInput.value);

function buildCalendar(month, year){
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  let html = `<div class="month">${monthNames[month]} ${year}</div>`;
  html += `<div class="weekdays">
    <div>Sun</div>     
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
  </div>`;
  html += `<div class="days">`;
  for(let i=0;i<firstDay;i++){html+=`<div></div>`;}
  for(let d=1;d<=daysInMonth;d++){
    const dayOfWeek = (firstDay + d - 1) % 7;
    const weekendClass = (dayOfWeek === 0 || dayOfWeek === 6) ? 'weekend' : '';
    html+=`<div class="${weekendClass}">${d}</div>`;
  }
  html += `</div>`;
  calendar.innerHTML = html;
  const dayDivs = calendar.querySelectorAll('.days div');
  dayDivs.forEach((div,i)=>{
    setTimeout(()=>{div.style.opacity=1; div.style.transform="translateY(0)";}, i*20);
  });
}
buildCalendar(currentMonth, currentYear);

function changeMonth(step){
  const dayDivs = calendar.querySelectorAll('.days div');
  dayDivs.forEach((div,i)=>{
    setTimeout(()=>{div.style.opacity=0; div.style.transform="translateY(10px)";}, i*5);
  });
  setTimeout(()=>{
    currentMonth += step;
    if(currentMonth < 0){ currentMonth = 11; currentYear--; }
    if(currentMonth > 11){ currentMonth = 0; currentYear++; }
    buildCalendar(currentMonth, currentYear);
    yearInput.value = currentYear;
  },200);
}
prevBtn.onclick = ()=> changeMonth(-1);
nextBtn.onclick = ()=> changeMonth(1);

toggleBtn.onclick = ()=>{
  document.body.classList.toggle('dark');
  toggleBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
};

yearInput.addEventListener('input', ()=>{
  yearInput.value = yearInput.value.replace(/\D/g,'');
  if(yearInput.value.length > 4) yearInput.value = yearInput.value.slice(0,4);
});

yearInput.addEventListener('change', ()=>{
  let y = yearInput.value;
  if(y.length < 4) y = '1000'.slice(0,4-y.length)+y;
  let year = parseInt(y);
  if(year < 1000) year = 1000;
  if(year > 9999) year = 9999;
  currentYear = year;
  yearInput.value = currentYear;
  buildCalendar(currentMonth, currentYear);
});

function createFlower(){
  const flower = document.createElement('div');
  flower.className = 'flower';
  flower.style.left = Math.random() * (window.innerWidth - 30) + 'px';
  flower.style.animationDuration = (5 + Math.random() * 5) + 's';
  for(let i=0;i<5;i++){
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.transform = `translate(-50%,-50%) rotate(${i*72}deg)`;
    flower.appendChild(petal);
  }
  document.body.appendChild(flower);
  flower.addEventListener('animationend', () => {
    flower.remove();
  });
}
setInterval(createFlower, 500);
</script>
</body>
</html>
